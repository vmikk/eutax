      vsearch_exact:  "/data/EUKARYOME/1.9.4/EU194_SSU.fasta.gz"
  
  # EUKARYOME LSU database
  eukaryome_lsu_194:
    description: "EUKARYOME LSU (28S) rRNA reference database"
    version: "1.9.4"
    regions: ["LSU"]
    paths:
