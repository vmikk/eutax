      vsearch_global: "/data/EUKARYOME/1.9.4/EU194_LSU.udb"
      vsearch_exact:  "/data/EUKARYOME/1.9.4/EU194_LSU.fasta.gz"
  
  # EUKARYOME LONG database (near-full rRNA)
  eukaryome_long_194:
    description: "EUKARYOME near-full rRNA reference database"
